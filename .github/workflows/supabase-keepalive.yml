name: Supabase Keepalive

# 無料Supabaseは7日間アクセスが無いと自動で一時停止する。
# 3日ごとに軽くアクセスして「使用中」を保ち、停止を防ぐ（他の人がいつ使っても止まっていない状態にする）。
on:
  schedule:
    - cron: '0 2 */3 * *' # 3日ごと 02:00 UTC
  workflow_dispatch: {} # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keep project active)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wzvwriesrxrdypduhaph.supabase.co/rest/v1/app_data?select=user_id&limit=1" \
            -H "apikey: sb_publishable_N_RoC9vSuiBlrFznK-cMFA_FjCrZRzP" \
            -H "Authorization: Bearer sb_publishable_N_RoC9vSuiBlrFznK-cMFA_FjCrZRzP")
          echo "Supabase responded with HTTP $CODE"
